[project]
name = "Contextra"
version = "0.1.0"
description = "RAG chatbot using FAISS, BM25, local embeddings, and Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "langchain-text-splitters>=0.3.0,<1.0.0",
    "langchain-groq>=0.1.0",
    "rank-bm25>=0.2.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "torchvision>=0.29.1",
    "langchain-openai>=0.3.35",
]

[dependency-groups]
dev = [
"pytest>=8.0.0",
"pytest-cov>=5.0.0",
]
